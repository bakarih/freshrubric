[project]
name = "freshrubric"
version = "0.0.0"
description = "A grounding layer that keeps AI-generated hiring content tied to the real, current job market."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bakari Holmes" }]
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
    "S",   # flake8-bandit
    "PT",  # flake8-pytest-style
    "TID", # flake8-tidy-imports
    "DTZ", # flake8-datetimez
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
